name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        components: rustfmt, clippy

    - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --locked --features test-support -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

    - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

    - name: Run tests
      run: cargo test --all-targets --locked --features test-support --verbose

  security:
    name: Security and release policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

    - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

    - name: Install policy tools
      uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
      with:
        tool: cargo-deny@0.20.2,cargo-machete@0.9.2
        fallback: none

    - name: Install cargo-dist
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh |
          sh

    - name: Check dependencies
      run: |
        cargo deny check
        cargo machete --with-metadata

    - name: Check workflow and release policy
      run: |
        ./scripts/check-workflow-pins.sh
        ./scripts/check-release-metadata.sh
        ./scripts/check-package-contents.sh
        mkdir -p target
        dist plan --output-format=json > target/dist-plan.json
        ./scripts/check-release-assets.sh target/dist-plan.json
