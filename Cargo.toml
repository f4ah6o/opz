[package]
name = "opz"
version = "2026.5.23"
edition = "2021"
description = "1Password CLI wrapper for seamless secret injection into commands"
license = "MIT"
repository = "https://github.com/opz-rs/opz"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"

[dev-dependencies]
tempfile = "3.24.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
