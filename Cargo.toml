[package]
name = "opz"
version = "2026.8.2"
edition = "2021"
description = "1Password CLI wrapper for seamless secret injection into commands"
license = "MIT"
repository = "https://github.com/opz-rs/opz"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.53", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
onepassword-sdk-unofficial = "0.2.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha2 = "0.10.9"
tempfile = "3.24.0"
toml = "0.8.23"

[dev-dependencies]
proptest = "1.11.0"

[[bin]]
name = "opz-test-tool"
path = "tests/support/fake_tool_main.rs"
required-features = ["test-support"]
test = false
bench = false

[[test]]
name = "hermetic_cli"
path = "tests/hermetic_cli.rs"
required-features = ["test-support"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
