[package]
name = "opz"
version = "2026.5.23"
edition = "2021"
description = "1Password CLI wrapper for seamless secret injection into commands"
license = "MIT"
repository = "https://github.com/f4ah6o/opz"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha2 = "0.10.9"
tempfile = "3.24.0"
toml = "0.9.8"

[dev-dependencies]
